name: Paradata Canonical Drift
on:
  push:
    branches: [test, vit, clip, master]
  pull_request:
    branches: [test, vit, clip, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read   # least privilege: these jobs only ever read the tree

jobs:
  check-drift:
    uses: ufal/atrium-project/.github/workflows/para-drift.reusable.yml@14110d7db2f48068b8814875975617d29bee74c1  # v1
    with:
      hub-ref: 14110d7db2f48068b8814875975617d29bee74c1
