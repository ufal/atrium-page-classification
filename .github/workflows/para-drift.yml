name: Paradata Canonical Drift
on:
  push:
    branches: [test, vit, clip, master]
  pull_request:
    branches: [test, vit, clip, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read   # least privilege: these jobs only ever read the tree

jobs:
  check-drift:
    uses: ufal/atrium-project/.github/workflows/para-drift.reusable.yml@4435ffbe75188a5d0a11c96180ca10efa616991d  # v1
    with:
      hub-ref: 4435ffbe75188a5d0a11c96180ca10efa616991d
