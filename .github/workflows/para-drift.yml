name: Paradata Canonical Drift
on:
  pull_request:
    branches: [test, vit, clip, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read   # least privilege: these jobs only ever read the tree

jobs:
  check-drift:
    uses: ufal/atrium-project/.github/workflows/para-drift.reusable.yml@fbffe25a9d1bcf681274d74f0dd026045d0478de  # v1
    with:
      hub-ref: fbffe25a9d1bcf681274d74f0dd026045d0478de
