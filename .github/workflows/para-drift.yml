name: Paradata Canonical Drift
on:
  push:
    branches: [test, vit, clip, master]
  pull_request:
    branches: [test, vit, clip, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read   # least privilege: these jobs only ever read the tree

jobs:
  check-drift:
    uses: ufal/atrium-project/.github/workflows/para-drift.reusable.yml@b07090fea83896c1ce25be5233c6f6d0c41b5e2b  # v1
    with:
      hub-ref: b07090fea83896c1ce25be5233c6f6d0c41b5e2b
