name: Paradata Canonical Drift
on:
  pull_request:
    branches: [test, vit, clip, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read   # least privilege: these jobs only ever read the tree

jobs:
  check-drift:
    uses: ufal/atrium-project/.github/workflows/para-drift.reusable.yml@ff0a8eac7eb8580acd576159e7ee12d0623b8f8d  # v1
    with:
      hub-ref: ff0a8eac7eb8580acd576159e7ee12d0623b8f8d
