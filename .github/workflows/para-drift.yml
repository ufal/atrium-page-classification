name: Paradata Canonical Drift
on:
  push:
    branches: [test, vit, clip, master]
  pull_request:
    branches: [test, vit, clip, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read   # least privilege: these jobs only ever read the tree

jobs:
  check-drift:
    uses: ufal/atrium-project/.github/workflows/para-drift.reusable.yml@e11c882f9e005f9bd38e8335bf1521f64dde4a64  # v1
    with:
      hub-ref: e11c882f9e005f9bd38e8335bf1521f64dde4a64
