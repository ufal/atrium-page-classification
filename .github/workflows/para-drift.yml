name: Paradata Canonical Drift
on:
  push:
    branches: [test, vit, clip, master]
  pull_request:
    branches: [test, vit, clip, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read   # least privilege: these jobs only ever read the tree

jobs:
  check-drift:
    uses: ufal/atrium-project/.github/workflows/para-drift.reusable.yml@51aad6c9a657229a1d41f86ce7119bddbfcff9f5  # v1
    with:
      hub-ref: 51aad6c9a657229a1d41f86ce7119bddbfcff9f5
