# atrium-page-classification — CodeQL static analysis
#
# Thin caller for ufal/atrium-project's codeql.reusable.yml (#18, T3). Was a
# ~44-line standalone workflow; five near-identical copies differed only by an
# arbitrary weekly cron.
#
# The schedule stays here because `on:` can only be declared by the caller.

name: CodeQL

on:
  push:
    branches: [test, vit, clip, master]
  pull_request:
    branches: [test, vit, clip, master]
  schedule:
    # Weekly, catching advisories published since the last push. Staggered
    # 15 min apart across the ecosystem rather than all firing at once.
    - cron: "45 5 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # `github.event_name` keeps a push from cancelling the scheduled run: this group was
  # keyed by ref alone, so both landed in ONE group and the push won -- and a cancelled
  # nightly reports no failure rather than a result. (issue atrium-project#10)
  cancel-in-progress: true

jobs:
  analyze:
    permissions:
      # REQUIRED — a reusable workflow's permissions are capped by this block.
      # Omitting security-events makes GitHub reject this file at parse time
      # (startup_failure, not a step failure), exactly as the Wave B change did
      # to docker.yml in all five repos (#18).
      security-events: write
      actions: read
      contents: read
    uses: ufal/atrium-project/.github/workflows/codeql.reusable.yml@v1
