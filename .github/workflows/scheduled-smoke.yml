name: Scheduled Smoke Tests

on:
  schedule:
    - cron: "0 3 * * *"   # daily 03:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A scheduled run is never redundant with a push run, and a cancelled one
  # reports no failure rather than a result. (issue atrium-project#10)
  cancel-in-progress: false

env:
  APT_PACKAGES: "build-essential g++ libgl1 libglib2.0-0 poppler-utils"
  PRE_INSTALL_TORCH: "torch==2.7.1 torchvision==0.22.1"
  REQUIREMENTS: "setup/requirements.txt setup/requirements-test.txt service/requirements.txt"

jobs:
  slow-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache HuggingFace models
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-models-smoke-${{ hashFiles('setup/requirements.txt') }}
          restore-keys: hf-models-smoke-

      - name: Install APT packages
        run: sudo apt-get update && sudo apt-get install -y ${{ env.APT_PACKAGES }}

      # Read the spec from the environment, never via ${{ }}. Expression substitution
      # happens BEFORE the shell sees the script, so `${{ env.PRE_INSTALL_TORCH }}`
      # wrote `pip install torch>=2.1,<3.0 …` into the script source — where `>=2.1,`
      # and `<3.0` are redirections, not part of a version spec. The step died on a
      # missing file named `3.0` having silently created one named `=2.1,`, before pip
      # ran at all (ufal/atrium-alto-postprocess run 34008513286).
      #
      # A shell expansion would be enough on its own, since bash does not re-parse
      # redirections out of an expanded value — that is why the hub's
      # docker-tool.reusable.yml survives the same spec with a bare $TORCH_SPEC. The
      # array is used here anyway because it states both requirements outright: the
      # value must word-split (page-classification passes two packages) and each word
      # must reach pip as a literal. Quoting "$PRE_INSTALL_TORCH" would satisfy only
      # the second and break the first.
      - name: Pre-install PyTorch (CPU wheel)
        run: |
          read -ra specs <<< "$PRE_INSTALL_TORCH"
          pip install "${specs[@]}" --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: |
          for req in ${{ env.REQUIREMENTS }}; do
            if [ -f "$req" ]; then pip install -r "$req"; fi
          done
          pip install pytest pytest-cov

      - name: Verify HF model revision exists
        run: |
          pip install huggingface_hub
          python -c "
          from huggingface_hub import HfApi
          HfApi().repo_info('ufal/vit-historical-page', revision='v4.3')
          print('HF revision v4.3 OK')
          "

      - name: Run slow tests (models + network)
        env:
          PYTHONPATH: .
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -m pytest -m slow -v --tb=short

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const title = `Scheduled smoke tests failed (${new Date().toISOString().slice(0,10)})`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `The scheduled \`slow\` test run failed: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nLikely cause: upstream HF revision moved, LINDAT API change, or a dependency update.`,
              labels: ["ci", "upstream"],
            });
