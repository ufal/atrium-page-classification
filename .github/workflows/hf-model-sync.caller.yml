name: HF Hub Sync and Eval

on:
  push:
    # Workflows should trigger on the correct test and master branches[cite: 1, 2]
    branches: [test, master]
  workflow_dispatch:

jobs:
  hf-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt huggingface_hub

      - name: HF Model Download / Evaluation
        env:
          # Restrict secrets purely to HF plumbing out of the default path
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Use the token securely for hub downloads/uploads
          python -c "
          from huggingface_hub import login
          import os
          
          token = os.environ.get('HF_TOKEN')
          if token:
              login(token=token)
              print('Successfully authenticated with Hugging Face Hub.')
              # Proceed with model evaluation or page-image routing
          else:
              print('No HF_TOKEN found. Running unauthenticated.')
          "