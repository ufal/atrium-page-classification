name: Docker Build & Publish

on:
  push:
    branches: [vit, test, clip, master]
    tags: ['v*']
  pull_request:
    branches: [vit, test, clip, master]
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # never cancel a tag build - that is a publish in flight
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    permissions:
      # security-events:write is required because docker-tool.reusable.yml's
      # build-and-push job uploads the post-publish Trivy SARIF. A reusable
      # workflow's permissions are CAPPED BY THIS BLOCK, so omitting it makes
      # GitHub reject the whole file at parse time with "requesting
      # 'security-events: write', but is only allowed 'security-events: none'"
      # — a startup_failure, not a step failure (#18). Same grant security.yml
      # already makes for its own SARIF upload. Not an escalation: this job
      # already holds packages: write.
      contents: read
      packages: write
      security-events: write
    uses: ufal/atrium-project/.github/workflows/docker-tool.reusable.yml@v1
    secrets:
      # Explicit instead of `secrets: inherit` — the reusable declares and
      # needs only this one (#18). inherit handed it every repo secret.
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      image-name: ufal/atrium-page-classification
      apt-packages: build-essential g++ libgl1 libglib2.0-0 poppler-utils
      pre-install-torch: torch==2.7.1 torchvision==0.22.1
      requirements: setup/requirements.txt setup/requirements-test.txt service/requirements.txt
      hf-model-cache: true
      # Must track the -rev pin in the Dockerfile CMD (currently v4.3) and
      # PC_REVISION in the hub's e2e-pipeline-smoke.yml. Bump all three together.
      hf-cache-key: v4.3
      build-targets: '["base", "api"]'
      # issue #55: `api` is a new Dockerfile stage. Before it existed, this repo's
      # FastAPI service was reachable only via a docker-compose entrypoint override on
      # the batch image, so no runnable API image was published and there was nothing
      # for ARÚP/ARÚB to deploy. Only `api` is probed — `base` is a batch CLI.
      probe-targets: '["api"]'
