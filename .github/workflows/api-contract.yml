name: API Meta-Contract
on:
  push:
    branches: [test, vit, clip, master]
  pull_request:
    branches: [test, vit, clip, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read   # least privilege: these jobs only ever read the tree

jobs:
  api-contract:
    uses: ufal/atrium-project/.github/workflows/api-contract.reusable.yml@b07090fea83896c1ce25be5233c6f6d0c41b5e2b  # v1
