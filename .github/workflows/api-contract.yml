name: API Meta-Contract
on:
  push:
    branches: [test, vit, clip, master]
  pull_request:
    branches: [test, vit, clip, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read   # least privilege: these jobs only ever read the tree

jobs:
  api-contract:
    uses: ufal/atrium-project/.github/workflows/api-contract.reusable.yml@28a22ebb1d1294e8238ca13bca9fc8bfe5761c05  # v1
