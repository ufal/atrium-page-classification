name: API Meta-Contract
on:
  push:
    branches: [test, vit, clip, master]
  pull_request:
    branches: [test, vit, clip, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read   # least privilege: these jobs only ever read the tree

jobs:
  api-contract:
    uses: ufal/atrium-project/.github/workflows/api-contract.reusable.yml@da7a066f5a1c1ecf024f9a8b82cca949a9ee0e91  # v1
