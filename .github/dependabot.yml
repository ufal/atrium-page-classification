version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "test"
    groups:
      actions:
        patterns:
          - "*"

  # This repo's real pins live under setup/ and service/. The single `directory: "/"`
  # entry that used to be here saw only the root requirements-test.txt — which is a
  # one-line `-r setup/requirements-test.txt` forwarding stub with nothing to bump —
  # so the actual dependency surface went unmonitored (#18, 2026-07-29 audit).
  #
  # One entry for both manifest directories, not one per directory: Pillow and pypdfium2
  # are declared in both, and tests/test_service_runtime_deps.py refuses two specifiers
  # for one dependency. With an entry per directory each bump raised one manifest only
  # and failed that test (#69 and #70, 11-10; #69 again on 11-14). The `shared-deps`
  # group below gives each such dependency one PR that raises it in both directories;
  # the test checks that every dependency declared in both manifests is in that group.
  - package-ecosystem: "pip"
    directories:
      - "/setup"
      - "/service"
    schedule:
      interval: "weekly"
    target-branch: "test"
    groups:
      shared-deps:
        group-by: dependency-name
        patterns:
          - "pillow"
          - "pypdfium2"
      pip-deps:
        patterns:
          - "*"
    ignore:
      - dependency-name: "torch"
      - dependency-name: "torchvision"
      - dependency-name: "transformers"
        versions: [">= 5.0.0"]
      # numpy 2.5.0 dropped Python 3.11 (`Requires-Python >=3.12`), which everything
      # here is pinned to. Dependabot cannot see that: it raises the floor to the
      # latest version from the range alone, and `numpy>=2.5.1,<3.0` has no
      # installable candidate on 3.11, so pip aborts the whole install. That landed
      # twice (#36, #37) before this ignore existed. Lift it together with the `<2.5`
      # cap in setup/requirements.txt when the images move to 3.12 — not before.
      #
      # This block was commented out five minutes after it was added (469b1d7 →
      # a1700ed) and the hole reproduced immediately: PR #38 opened six minutes later
      # and `Docker Build & Publish` on 80161d7 died with `No matching distribution
      # found for numpy<2.6,>=2.5.1`, the same failure as #36/#37. Restored for
      # atrium-project#10 (G2). The two halves of this policy — this ignore and the
      # `<2.5` cap in setup/requirements.txt — reference each other on purpose: a
      # future editor who lifts one without the other gets the bump back next Monday.
      # It covers service/ too: no numpy is declared there today, but the fast lane
      # installs both manifests into the same 3.11 interpreter.
      - dependency-name: "numpy"
        versions: [">= 2.5.0"]
      # Pinned exactly in setup/requirements-test.txt and in service/requirements.txt: the
      # committed service/openapi.json is a function of both (atrium-project#32 round 2). Bump
      # them together by hand and regenerate the spec in the same commit (python
      # atrium_openapi.py export --app service.api:app --prepare tests.openapi_contract_data:prepare),
      # so the release's breaking-change check sees what the upgrade changes.
      - dependency-name: "fastapi"
      - dependency-name: "pydantic"
