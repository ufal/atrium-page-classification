version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "test"
    groups:
      actions:
        patterns:
          - "*"

  # This repo's real pins live under setup/ and service/. The single `directory: "/"`
  # entry that used to be here saw only the root requirements-test.txt — which is a
  # one-line `-r setup/requirements-test.txt` forwarding stub with nothing to bump —
  # so the actual dependency surface went unmonitored (#18, 2026-07-29 audit).
  # Split per manifest directory, mirroring atrium-alto-postprocess.
  - package-ecosystem: "pip"
    directory: "/setup"
    schedule:
      interval: "weekly"
    target-branch: "test"
    groups:
      setup-deps:
        patterns:
          - "*"
    ignore:
      - dependency-name: "torch"
      - dependency-name: "torchvision"
      - dependency-name: "transformers"
        versions: [">= 5.0.0"]
#      # numpy 2.5.0 dropped Python 3.11 (`Requires-Python >=3.12`), which everything
#      # here is pinned to. Dependabot cannot see that: it raises the floor to the
#      # latest version from the range alone, and `numpy>=2.5.1,<3.0` has no
#      # installable candidate on 3.11, so pip aborts the whole install. That landed
#      # twice (#36, #37) before this ignore existed. Lift it together with the `<2.5`
#      # cap in setup/requirements.txt when the images move to 3.12 — not before.
#      - dependency-name: "numpy"
#        versions: [">= 2.5.0"]

  - package-ecosystem: "pip"
    directory: "/service"
    schedule:
      interval: "weekly"
    target-branch: "test"
    groups:
      service-deps:
        patterns:
          - "*"
    ignore:
      - dependency-name: "torch"
      - dependency-name: "torchvision"
      - dependency-name: "transformers"
        versions: [">= 5.0.0"]
      # Mirrors /setup deliberately, as the three above already do: this list is a
      # uniform policy block, not a per-manifest minimum. No numpy here today, but the
      # fast lane installs into the same 3.11 interpreter, so one arriving later
      # inherits the constraint instead of rediscovering it the hard way.
      - dependency-name: "numpy"
        versions: [">= 2.5.0"]
